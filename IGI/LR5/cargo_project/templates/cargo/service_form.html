{% extends 'base.html' %}
{% block title %}Услуга{% endblock %}
{% block content %}
<h1>{% if mode == 'create' %}Новая услуга{% else %}Изменение услуги{% endif %}</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {% for f in form %}
        <div class="field">{{ f.label_tag }}{{ f }}{{ f.errors }}</div>
    {% endfor %}
    <button class="btn" type="submit">Сохранить</button>
    <a class="btn btn-secondary" href="{% url 'cargo:services_list' %}">Отмена</a>
</form>
{% endblock %}
