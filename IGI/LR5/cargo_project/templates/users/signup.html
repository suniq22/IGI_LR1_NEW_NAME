{% extends 'base.html' %}
{% block title %}Регистрация — {{ site_company_name }}{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {% for f in form %}
        <div class="field">
            {{ f.label_tag }}
            {{ f }}
            {{ f.errors }}
            {% if f.help_text %}<div class="muted">{{ f.help_text }}</div>{% endif %}
        </div>
    {% endfor %}
    <button class="btn" type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
