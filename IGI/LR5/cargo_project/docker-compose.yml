version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cargo_db}
      POSTGRES_USER: ${POSTGRES_USER:-cargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargo_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-cargo_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: cargogo-web:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
      DJANGO_ALLOWED_HOSTS: "*"
      USE_POSTGRES: "True"
      POSTGRES_DB: ${POSTGRES_DB:-cargo_db}
      POSTGRES_USER: ${POSTGRES_USER:-cargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargo_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
      - logs:/app/logs

volumes:
  pgdata:
  media:
  logs:
